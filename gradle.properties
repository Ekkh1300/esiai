# Gradle configuration for Sokhan.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache hits an AGP 9.1 serialization bug in ProcessNavigationXmlTask
# ("path is null"); plain caching keeps incremental compilation benefits instead.
org.gradle.configuration-cache=false

# Network resilience: mirrors (required behind geo-restricted egress) answer
# with transient 502s on cold paths; retry instead of failing the build.
org.gradle.internal.repository.max.tentatives=8
org.gradle.internal.repository.initial.connection.timeout=15000

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
