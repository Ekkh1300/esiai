name: Feature request
about: Suggest an idea for Sokhan
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Sketch UI/behavior in as much detail as you like.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgment
      options:
        - label: I understand Sokhan has no server component and stays local-first / BYOK
          required: true
